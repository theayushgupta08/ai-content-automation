{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "avg.fullname" . }}
  labels:
    {{- include "avg.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ default (printf "%s-tls" (include "avg.fullname" .)) .Values.ingress.tls.secretName }}
      hosts:
        {{- if .Values.api.enabled }}
        - {{ .Values.ingress.api.host }}
        {{- end }}
        {{- if .Values.web.enabled }}
        - {{ .Values.ingress.web.host }}
        {{- end }}
  {{- end }}
  rules:
    {{- if .Values.api.enabled }}
    - host: {{ .Values.ingress.api.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "avg.fullname" . }}-api
                port:
                  name: http
    {{- end }}
    {{- if .Values.web.enabled }}
    - host: {{ .Values.ingress.web.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "avg.fullname" . }}-web
                port:
                  name: http
    {{- end }}
{{- end }}
