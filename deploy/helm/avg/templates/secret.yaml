{{- if .Values.secrets.create }}
# Dev clusters only. Production environments sync this Secret from a secret manager
# (externalsecret.yaml) or create it out of band.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avg.secretName" . }}
  labels:
    {{- include "avg.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
