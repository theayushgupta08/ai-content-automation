apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "avg.configName" . }}
  labels:
    {{- include "avg.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  LOG_FORMAT: json
  API_PORT: {{ .Values.api.port | quote }}
  API_URL: {{ .Values.config.apiUrl | quote }}
  WEB_URL: {{ .Values.config.webUrl | quote }}
  CORS_ORIGINS: {{ default .Values.config.webUrl .Values.config.corsOrigins | quote }}
  DEV_AUTH: "false"
  TEMPORAL_ADDRESS: {{ .Values.config.temporal.address | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.config.temporal.namespace | quote }}
  TEMPORAL_TASK_QUEUE: {{ .Values.config.temporal.taskQueue | quote }}
  TEMPORAL_TLS: {{ .Values.config.temporal.tls | quote }}
  MEDIA_BACKEND: s3
  MEDIA_CACHE_DIR: {{ .Values.worker.cache.dir | quote }}
  S3_BUCKET: {{ .Values.config.media.bucket | quote }}
  S3_REGION: {{ .Values.config.media.region | quote }}
  S3_ENDPOINT: {{ .Values.config.media.endpoint | quote }}
  S3_PUBLIC_ENDPOINT: {{ .Values.config.media.publicEndpoint | quote }}
  MEDIA_URL_TTL_SEC: {{ .Values.config.media.urlTtlSec | quote }}
  PROVIDER_MODE: {{ .Values.config.providers.mode | quote }}
  WORKER_METRICS_ADDR: {{ printf "0.0.0.0:%d" (int .Values.worker.metricsPort) | quote }}
  {{- range $k, $v := .Values.config.providers.settings }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- range $k, $v := .Values.config.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
