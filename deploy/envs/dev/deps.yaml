# In-cluster dependencies for a dev cluster (kind, k3d, Docker Desktop): Postgres, Redis, MinIO
# and a single-node Temporal. Not for staging or prod, which use RDS, ElastiCache, S3 and
# Temporal Cloud. Apply into the same namespace as the chart:
#   kubectl -n avg apply -f deploy/envs/dev/deps.yaml
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, labels: { app: postgres } }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: avg }
            - { name: POSTGRES_PASSWORD, value: avg }
            - { name: POSTGRES_DB, value: avg }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, avg, -d, avg] }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, labels: { app: redis } }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --save, '', --appendonly, 'no']
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, labels: { app: minio } }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: [server, /data, --console-address, ':9001']
          env:
            - { name: MINIO_ROOT_USER, value: minio }
            - { name: MINIO_ROOT_PASSWORD, value: minio12345 }
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: minio }
spec:
  selector: { app: minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: batch/v1
kind: Job
metadata: { name: minio-init }
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - >
              until mc alias set local http://minio:9000 minio minio12345; do sleep 2; done &&
              mc mb --ignore-existing local/avg-media
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: temporal, labels: { app: temporal } }
spec:
  replicas: 1
  selector: { matchLabels: { app: temporal } }
  template:
    metadata: { labels: { app: temporal } }
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.28.0
          env:
            - { name: DB, value: postgres12 }
            - { name: DB_PORT, value: '5432' }
            - { name: POSTGRES_USER, value: avg }
            - { name: POSTGRES_PWD, value: avg }
            - { name: POSTGRES_SEEDS, value: postgres }
            - { name: DYNAMIC_CONFIG_FILE_PATH, value: config/dynamicconfig/development-sql.yaml }
          ports: [{ containerPort: 7233 }]
          readinessProbe:
            tcpSocket: { port: 7233 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: temporal }
spec:
  selector: { app: temporal }
  ports: [{ port: 7233, targetPort: 7233 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: temporal-ui, labels: { app: temporal-ui } }
spec:
  replicas: 1
  selector: { matchLabels: { app: temporal-ui } }
  template:
    metadata: { labels: { app: temporal-ui } }
    spec:
      containers:
        - name: ui
          image: temporalio/ui:2.39.0
          env:
            - { name: TEMPORAL_ADDRESS, value: temporal:7233 }
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: temporal-ui }
spec:
  selector: { app: temporal-ui }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mailpit, labels: { app: mailpit } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mailpit } }
  template:
    metadata: { labels: { app: mailpit } }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          ports: [{ containerPort: 1025 }, { containerPort: 8025 }]
---
apiVersion: v1
kind: Service
metadata: { name: mailpit }
spec:
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: 1025 }
    - { name: http, port: 8025, targetPort: 8025 }
