name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://avg:avg@localhost:5432/avg
  REDIS_URL: redis://localhost:6379

jobs:
  typescript:
    name: TypeScript (contracts, api, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: cd workers && uv sync --all-extras
      - name: Contracts are up to date
        run: pnpm check:contracts
      - run: pnpm --filter @avg/api prisma:generate
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

  python:
    name: Python workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Install Temporal CLI
        run: |
          curl -sSL -o /tmp/temporal.tar.gz https://github.com/temporalio/cli/releases/download/v1.4.1/temporal_cli_1.4.1_linux_amd64.tar.gz
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/temporal.tar.gz -C "$HOME/.local/bin" temporal
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cd workers && uv sync --all-extras
      - run: cd workers && uv run ruff check . && uv run ruff format --check .
      - run: cd workers && uv run mypy avg_workers
      - run: cd workers && uv run pytest -q

  deploy:
    name: Deploy manifests (helm, kubeconform, terraform fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.8
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform
      - run: make deploy-lint

  e2e:
    name: End-to-end demo (mock providers)
    runs-on: ubuntu-latest
    needs: [typescript, python]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: avg
          POSTGRES_PASSWORD: avg
          POSTGRES_DB: avg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U avg" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg, fonts and Temporal CLI
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          curl -sSL -o /tmp/temporal.tar.gz https://github.com/temporalio/cli/releases/download/v1.4.1/temporal_cli_1.4.1_linux_amd64.tar.gz
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/temporal.tar.gz -C "$HOME/.local/bin" temporal
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: cd workers && uv sync --all-extras
      - run: pnpm --filter @avg/api prisma:generate
      - run: pnpm --filter @avg/contracts build && pnpm --filter @avg/api build
      - name: Ledger tests against Postgres
        run: pnpm --filter @avg/api prisma:migrate && TEST_DATABASE_URL=$DATABASE_URL pnpm --filter @avg/api test
      - name: Run demo
        run: RENDER_SCALE=0.5 DEMO_DURATION=15 bash scripts/demo.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-output
          path: |
            .local/*.mp4
            .local/*.log
          if-no-files-found: ignore
